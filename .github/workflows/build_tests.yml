name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # full policy stack for e2e ACL tests; hivemind-core git pin until #89 merges
      pre_install_pip: '"hivescope==0.3.0a1" "hivemind-plugin-manager==0.6.0a1" "hivemind-ovos-agent-plugin==0.2.0a1" "hivemind-core @ git+https://github.com/JarbasHiveMind/HiveMind-core@feat/policy-chain-runner"'
      test_path: 'tests/'
