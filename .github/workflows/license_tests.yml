name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    with:
      # orjson is Apache+MIT+MPL-2.0; MPL is file-level copyleft, safe as library
      exclude_packages: "^orjson$"
