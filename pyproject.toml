[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-cli"
dynamic = ["version"]
description = "Mycroft Remote Cli"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "hivemind_bus_client>=0.0.3a2",
    "HiveMind_presence>=0.0.2a2",
]

[project.scripts]
hivemind-cli = "hivemind_cli_terminal.__main__:main"

[tool.setuptools]
packages = ["hivemind_cli_terminal"]

[tool.setuptools.dynamic]
version = {attr = "hivemind_cli_terminal.version.__version__"}
